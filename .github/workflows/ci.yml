name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, build and scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $VERSION"
            echo "Expected format: vMAJOR.MINOR.PATCH (example: v1.0.0)"
            exit 1
          fi

          echo "Validated release version: $VERSION"

      - name: Build backend Docker image
        run: docker build --tag todo-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build --tag todo-frontend:ci ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish:
    name: Publish versioned images to Amazon ECR
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test-and-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::484907528737:role/todo-ai-team-github-actions-ecr-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend release
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/todo-backend:$VERSION" \
            --tag "$REGISTRY/todo-backend:$SHA" \
            ./backend

          docker push "$REGISTRY/todo-backend:$VERSION"
          docker push "$REGISTRY/todo-backend:$SHA"

      - name: Build and push frontend release
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/todo-frontend:$VERSION" \
            --tag "$REGISTRY/todo-frontend:$SHA" \
            ./frontend

          docker push "$REGISTRY/todo-frontend:$VERSION"
          docker push "$REGISTRY/todo-frontend:$SHA"
